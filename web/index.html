<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TheoremLens</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="library" aria-label="서재">
    <h1>TheoremLens</h1>
    <form id="upload-form">
      <label class="file-btn">
        PDF 올리기
        <input id="file-input" type="file" accept="application/pdf,.pdf" hidden>
      </label>
    </form>
    <p id="library-msg" class="muted" role="status"></p>
    <ul id="book-list"></ul>
  </aside>

  <main id="chat">
    <div id="messages" aria-live="polite">
      <p class="muted empty">왼쪽에서 책을 선택하고 질문을 입력하세요. 답변은 선택한 책의 본문에서만 만들어집니다.</p>
    </div>
    <form id="chat-form">
      <textarea id="question" rows="2" maxlength="4000" placeholder="질문을 입력하세요 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
      <button id="send" type="submit">보내기</button>
      <button id="new-chat" type="button" class="secondary">새 대화</button>
    </form>
  </main>

  <aside id="source-panel" hidden aria-label="출처">
    <button id="close-panel" type="button" class="secondary" aria-label="닫기">닫기</button>
    <div id="source-body"></div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="lib.js"></script>
  <script src="app.js"></script>
</body>
</html>
