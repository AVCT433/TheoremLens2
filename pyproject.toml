[project]
name = "theoremlens"
version = "0.1.0"
description = "수학 전공책 기반 근거 중심 Q&A 챗봇"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "rapidfuzz>=3.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 텍스트 PDF의 수식을 LaTeX로 고품질 변환 (torch 포함, 용량 큼)
marker = ["marker-pdf>=1.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["theoremlens"]

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --strict-markers"
markers = ["integration: 실제 Gemini API나 로컬 임베딩 모델을 쓰는 테스트 (기본 제외)"]
